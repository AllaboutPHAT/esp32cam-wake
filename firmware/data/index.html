<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Camera Giám Sát</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">&#128247;</div>
    <h1>Camera Giám Sát</h1>
  </header>

  <section class="panel">
    <label class="field" for="host">
      <span>Địa chỉ camera</span>
      <input id="host" type="text" inputmode="url" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint">Ví dụ: <code>esp32cam.local:81</code> hoặc <code>192.168.1.200:81</code></p>
  </section>

  <details class="panel tune" id="tune-panel">
    <summary>Cài đặt hình ảnh</summary>
    <div class="tune-grid">
      <label class="tune-field">
        <span>Độ sáng <output id="t-brightness-val">2</output></span>
        <input id="t-brightness" type="range" min="-2" max="2" step="1" value="2">
      </label>
      <label class="tune-field">
        <span>Mức phơi sáng <output id="t-ae-val">0</output></span>
        <input id="t-ae" type="range" min="-2" max="2" step="1" value="0">
      </label>
      <label class="tune-field">
        <span>Khuếch đại ánh sáng (giảm nhiễu)</span>
        <select id="t-gain">
          <option value="2">2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
          <option value="16">16x</option>
          <option value="32" selected>32x</option>
          <option value="64">64x</option>
          <option value="128">128x</option>
        </select>
      </label>
      <label class="tune-field">
        <span>Độ nét ảnh (tăng để nét hơn) <output id="t-q-val">18</output></span>
        <input id="t-q" type="range" min="5" max="35" step="1" value="18">
      </label>
      <label class="tune-field">
        <span>Độ phân giải</span>
        <select id="t-size">
          <option value="qvga">QVGA (320x240)</option>
          <option value="vga" selected>VGA (640x480)</option>
          <option value="svga">SVGA (800x600)</option>
          <option value="hd">HD (1280x720)</option>
        </select>
      </label>
      <label class="tune-field tune-check">
        <span>Chế độ thiếu sáng (chậm hơn, sáng hơn)</span>
        <input id="t-aec2" type="checkbox">
      </label>
    </div>
    <div class="tune-actions">
      <button id="t-reset" type="button" class="mini-btn">Đặt lại mặc định</button>
      <span class="tune-note">Áp dụng ngay khi đang xem</span>
    </div>
  </details>

  <div id="view-wrap" hidden>
    <img id="view" alt="Hình ảnh camera" oncontextmenu="return false;">
    <div id="spinner" class="spinner" aria-label="Đang tải hình ảnh"></div>
  </div>

  <button id="btn" class="big-btn" type="button">Xem camera</button>
  <p id="status" class="status" role="status">Sẵn sàng. Bấm nút để đánh thức camera.</p>

  <p class="note">Camera đang ngủ để tiết kiệm điện. Khi bấm nút, camera sẽ thức dậy trong vài giây.</p>
</main>
<script src="app.js"></script>
</body>
</html>
